[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib']
test = 'test/foundry'
cache_path = 'forge-cache'
script = 'scripts'

solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 1

#eth-rpc-url = "https://rpcapi.fantom.network"
rpc_endpoints = { fantom = "${FANTOM_RPC}", optimism = "${OPTIMISM_RPC}", "base" = "${BASE_RPC}" }
#sender = ''
#initial_balance = '0xffffffffffffffffffffffff'

ffi = false
fs_permissions = [{ access = "read", path = "./"}]
#invariant_fail_on_revert = true

[profile.test.optimizer_details.yulDetails]
# Reduces compile times but produces poorly optimized code
optimizerSteps = ''

[fmt]
line_length = 100

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
